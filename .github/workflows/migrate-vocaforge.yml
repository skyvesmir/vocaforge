name: Migrate VocaForge snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-vocaforge.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: skyvesmir/ankiwosurutamenomono
          ref: main
          path: _old

      - name: Import VocaForge
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.github' ! -name '_old' \
            -exec rm -rf {} +

          cp -a "_old/vocaforge/." .
          cp -a "_old/vocab_work" ./vocab_work
          cp -a "_old/英語語彙アプリ作成用データ - 受験英単語まとめ（真）.csv" \
            "./vocab_work/英語語彙アプリ作成用データ - 受験英単語まとめ（真）.csv"

          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace(
              "https://github.com/skyvesmir/ankiwosurutamenomono",
              "https://github.com/skyvesmir/vocaforge",
          )
          if "## このリポジトリについて" not in text:
              text = text.replace(
                  "## デプロイ",
                  "## このリポジトリについて\n\n"
                  "VocaForgeは独立した学習Webアプリとして、このリポジトリで開発・公開しています。\n\n"
                  "## デプロイ",
              )
          readme.write_text(text, encoding="utf-8")

          gi = Path(".gitignore")
          gitignore = gi.read_text(encoding="utf-8")
          if "__pycache__/" not in gitignore:
              gitignore += "\n# Python\n__pycache__/\n*.py[cod]\n"
              gi.write_text(gitignore, encoding="utf-8")

          vgi = Path("vocab_work/.gitignore")
          if vgi.exists():
              t = vgi.read_text(encoding="utf-8")
              if "__pycache__/" not in t:
                  vgi.write_text(
                      t.rstrip() + "\n__pycache__/\n*.py[cod]\n",
                      encoding="utf-8",
                  )

          # The old repository's public portal remains separate; only this
          # standalone VocaForge repository should contain the application.
          PY

          rm -rf _old
          rm -f .github/workflows/migrate-vocaforge.yml

      - name: Commit migrated snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: migrate complete VocaForge snapshot" || exit 0
          git push origin HEAD:main
